<!DOCTYPE html>
<!--
    NutriBI - Recipes page
    The user searches with filters; js/recipes.js calls the Spoonacular API and shows
    4 recipe cards. Clicking a card opens a popup with nutrition, ingredients and method.
    
    Author: Hashini Liyanage
    Created Date: 16/10/2026

    Page structure uses HTML5 semantic elements (header, nav, main, section, article, footer).

    Sample code referenc: 
        https://www.sourcecodester.com/javascript/17715/food-recipes-nutrition-facts-using-html-css-and-javascript-source-code.html
        https://www.geeksforgeeks.org/javascript/design-a-recipe-app-in-html-css-javascript/

    Ref: MDN - Overview: Structuring content with HTML
        https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Structuring_documents
    Ref: Responsive top navigation: https://www.w3schools.com/howto/howto_js_topnav_responsive.asp 
-->

<!-- helps screen readers pronounce the content -->
<html lang="en">

<head>
    <!-- Help letters and symbols display correctly. -->
    <meta charset="utf-8" />
    <!-- makes the page responsive by matching its width to the device screen 
    Ref: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- author of the webpage -->
    <meta name="author" content="Hashini Liyanage" />
    <!-- short description of the webpage for search engines and previews -->
    <meta name="description"
        content="NutriBI - find recipes by cuisine, diet and calorie limit, with calories and nutrients per serving." />
    <!-- title displayed in the browser tab -->
    <title>NutriBI | Recipes</title>

    <!-- loads JavaScript files -->
    <script src="js/main.js" defer></script>
    <script src="js/recipes.js" defer></script>

    <!-- sets the browser tab icon 
    Ref: https://www.w3schools.com/html/html_favicon.asp -->
    <link rel="icon" href="images/icon.png" type="image/png">

    <!-- loads CSS files -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- allows keyboard users to skip the navigation and jump directly to the main content 
    Ref: https://medium.com/uxmm/straight-to-the-point-a-guide-to-skip-links-in-accessibility-205a2626ae6a -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <a href="index.html" class="logo">Nutri<span>BI</span></a>

        <!-- main navigation area, aria-label provides an accessible name for screen readers 
        Ref: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-label -->
        <nav aria-label="Main navigation">
            <button type="button" class="menu-toggle" aria-controls="main-menu" aria-expanded="false" aria-label="Menu">
                <!-- displays the hamburger menu, aria-hidden="true" prevents screen readers from announcing the decorative symbols 
                Ref: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden -->
                <span aria-hidden="true">☰</span>
            </button>
            <ul class="nav-list" id="main-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="calories.html">Calories</a></li>
                <!-- aria-current="page" marks the page the user is on
                Ref: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-current -->
                <li><a href="recipes.html" aria-current="page">Recipes</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <!-- aria-labelledby gives the section the heading's text as its name, so screen readers announce 'Recipes'
        Ref: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-labelledby -->
        <section class="intro" aria-labelledby="intro-title">
            <h1 id="intro-title">Recipes</h1>
            <p>Find recipes and see their calories and nutrients per serving.</p>

            <!-- recipe filter form; recipes.js reads every field and sends the values to the Spoonacular API.
            Ref: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms -->
            <form id="recipe-form">
                <!-- Text: what to cook -->
                <label for="recipe-search">Recipe or ingredient</label>
                <input type="search" id="recipe-search" name="query" required minlength="2" placeholder="pasta">

                <!-- Select: one choice from a long list -->
                <label for="cuisine">Cuisine</label>
                <select id="cuisine" name="cuisine">
                    <option value="">Any cuisine</option>
                    <option value="Chinese">Chinese</option>
                    <option value="French">French</option>
                    <option value="Greek">Greek</option>
                    <option value="Indian">Indian</option>
                    <option value="Italian">Italian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Mediterranean">Mediterranean</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Thai">Thai</option>
                </select>

                <!-- Radio buttons: exactly one choice from a short list -->
                <fieldset>
                    <legend>Diet</legend>
                    <label><input type="radio" name="diet" value="" checked> Any</label>
                    <label><input type="radio" name="diet" value="vegetarian"> Vegetarian</label>
                    <label><input type="radio" name="diet" value="vegan"> Vegan</label>
                    <label><input type="radio" name="diet" value="gluten free"> Gluten free</label>
                </fieldset>

                <!-- Number: a limit with min, max and step -->
                <label for="max-calories">Maximum calories per serving (optional)</label>
                <input type="number" id="max-calories" name="maxCalories" min="100" max="2000" step="50"
                    placeholder="600">

                <!-- Checkboxes: any number of choices (including none) -->
                <fieldset>
                    <legend>Avoid</legend>
                    <label><input type="checkbox" name="intolerances" value="dairy"> Dairy</label>
                    <label><input type="checkbox" name="intolerances" value="egg"> Egg</label>
                    <label><input type="checkbox" name="intolerances" value="peanut"> Peanut</label>
                    <label><input type="checkbox" name="intolerances" value="seafood"> Seafood</label>
                </fieldset>

                <button type="submit" class="button">Find recipes</button>
            </form>
        </section>

        <!-- recipe cards are added here by JavaScript after a search. aria-live="polite" makes screen readers announce the new content ("Searching…", results or error messages) when it changes.
        Ref: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions -->
        <section id="recipes" aria-live="polite"></section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 NutriBI</p>
        <p>
            Nutrition data from the
            <a href="https://fdc.nal.usda.gov/api-guide">USDA FoodData Central API</a>
            <span aria-hidden="true"> | </span>
            Recipes from the
            <a href="https://spoonacular.com/food-api">Spoonacular API</a>
        </p>
    </footer>

    <!-- Native HTML popup: hidden until JavaScript calls showModal() 
    Ref: dialog: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog
    -->
    <dialog id="recipe-dialog" aria-labelledby="recipe-title">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 id="recipe-title">Recipe</h2>

                <!-- method="dialog": this button closes the popup with NO JavaScript -->
                <form method="dialog">
                    <button type="submit" class="dialog-close" aria-label="Close recipe">
                        <span aria-hidden="true">✕</span>
                    </button>
                </form>
            </div>
            <!-- recipes.js fills this with the photo, nutrition, ingredients and method -->
            <div id="recipe-body"></div>
        </div>
    </dialog>
</body>

</html>
